version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hotel_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_concierge}
      POSTGRES_USER: ${POSTGRES_USER:-hotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hotel_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (optional session store) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: hotel_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel_user}:${POSTGRES_PASSWORD:-hotel_pass}@postgres:5432/${POSTGRES_DB:-hotel_concierge}
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIRECTORY: /app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── FAQ Ingestion (one-shot) ─────────────────────────────────────────────
  ingest:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: hotel_ingest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hotel_user}:${POSTGRES_PASSWORD:-hotel_pass}@postgres:5432/${POSTGRES_DB:-hotel_concierge}
      CHROMA_PERSIST_DIRECTORY: /app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
    command: python scripts/ingest_faq.py
    profiles:
      - ingest

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: hotel_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  chroma_data:
